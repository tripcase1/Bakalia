name: Al Hera Fresh CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package.json'

      - name: Install dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Build Next.js 15 Frontend
        run: |
          cd apps/frontend
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://alherafresh.com
